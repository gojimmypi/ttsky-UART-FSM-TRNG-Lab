name: fpga

on:
  push:
    # Comment out (or remove) the following line to run the FPGA workflow on every push:
    # branches: none
  workflow_dispatch:

jobs:
  fpga:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Clean oss-cad-suite temp before ICE40
        shell: bash
        run: |
          # setup-oss-cad-suite uses fixed names under RUNNER_TEMP.
          # Remove stale files from prior attempts or earlier wrapper steps.
          rm -rf "${RUNNER_TEMP:?}/oss-cad-suite" "${RUNNER_TEMP:?}/oss-cad-suite.tgz"

      - name: FPGA bitstream for TT ASIC Sim (ICE40UP5K)
        uses: TinyTapeout/tt-gds-action/fpga/ice40up5k@ttsky26c

      - name: Clean oss-cad-suite temp before ULX3S
        shell: bash
        run: |
          # The previous FPGA action may leave oss-cad-suite.tgz behind.
          rm -rf "${RUNNER_TEMP:?}/oss-cad-suite" "${RUNNER_TEMP:?}/oss-cad-suite.tgz"

      - name: FPGA bitstream for TT ASIC Sim (ULX3S ECP5)
        # Disabled by default.
        # To enable this step, change false to true:
        if: ${{ true }}

        uses: ulx3s/tt-gds-action/fpga/ulx3s@experimental
        timeout-minutes: 60

        # Optionally continue and ignore errors:
        # continue-on-error: true

        with:
          tools-repo: ulx3s/tt-support-tools
          tools-ref:  experimental

          # ULX3S ECP5 device name options:
          #
          # ecp5-device: 12k
          # ecp5-device: 45k
          # ecp5-device: 85k
          ecp5-device: 85k

          # ULX3S lpf constraint file options from https://github.com/emard/ulx3s/tree/master/doc/constraints
          #
          # lpf: tt/fpga/ulx3s/ulx3s_v316.lpf      # for v3.16, v3.17, v3.18: the most recent PCF file for most ULX3S purchased recently.
          # lpf: tt/fpga/ulx3s/ulx3s_v314.lpf      # for v3.14
          # lpf: tt/fpga/ulx3s/ulx3s_v20.lpf       # for versions 2.x .. 3.07
          # lpf: tt/fpga/ulx3s/ulx3s_v17patch.lpf  # for version 1.7
          lpf: tt/fpga/ulx3s/ulx3s_v20.lpf

          artifact-name: fpga_ulx3s_ecp5
          uart-enabled: true

      - name: Clean oss-cad-suite temp before ULX4M
        shell: bash
        run: |
          # The previous FPGA action may leave oss-cad-suite.tgz behind.
          rm -rf "${RUNNER_TEMP:?}/oss-cad-suite" "${RUNNER_TEMP:?}/oss-cad-suite.tgz"

      - name: FPGA bitstream for TT ASIC Sim (ULX4M ECP5)
        # Disabled by default.
        # To enable this step, change false to true:
        if: ${{ true }}

        uses: ulx3s/tt-gds-action/fpga/ulx4m@experimental
        timeout-minutes: 60

        # Optionally continue and ignore errors:
        # continue-on-error: true

        with:
          tools-repo: ulx3s/tt-support-tools
          tools-ref:  experimental

          # ULX4M ECP5 device name options:
          #
          # ecp5-device: 12k
          # ecp5-device: 45k
          # ecp5-device: 85k
          ecp5-device: 85k

          # ULX4M lpf constraint file options from https://github.com/intergalaktik/ulx4m/tree/ulx4m-ls/doc/constraints
          #
          # lpf: tt/fpga/ulx4m/ulx4m-ld_v001.lpf
          # lpf: tt/fpga/ulx4m/ulx4m-ld_v002.lpf
          # lpf: tt/fpga/ulx4m/ulx4m_ls_v003.lpf
          # lpf: tt/fpga/ulx4m/ulx4m_v002.lpf
          # lpf: tt/fpga/ulx4m/ulx4m_v01.lpf
          lpf: tt/fpga/ulx4m/ulx4m_ls_v003.lpf

          artifact-name: fpga_ulx4m_ecp5
          uart-enabled: true
